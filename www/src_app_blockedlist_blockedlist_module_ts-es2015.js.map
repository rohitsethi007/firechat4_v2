export default "<ion-header class=\"ion-no-border\">\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-back-button text=\"\" icon=\"chevron-back-outline\"></ion-back-button>\n    </ion-buttons>\n    <ion-title>Blocked Contacts</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"ion-padding\">\n  <!-- Empty State -->\n  <div *ngIf=\"blockedList.length === 0\" class=\"empty-state\">\n    <ion-icon name=\"shield-checkmark-outline\"></ion-icon>\n    <h3>No Blocked Contacts</h3>\n    <p>When you block someone, they'll appear here</p>\n  </div>\n\n  <!-- Blocked List -->\n  <ion-list *ngIf=\"blockedList.length > 0\" class=\"blocked-list\">\n    <ion-item-sliding *ngFor=\"let user of blockedList\">\n      <ion-item class=\"user-item\">\n        <ion-avatar slot=\"start\">\n          <img [src]=\"user.img\" \n               [alt]=\"user.name\"\n               (error)=\"$event.target.src='assets/images/default-avatar.png'\">\n        </ion-avatar>\n        <ion-label>\n          <h2>{{user.name}}</h2>\n          <p>Blocked</p>\n        </ion-label>\n        <ion-button slot=\"end\" \n                    (click)=\"unblock(user.key)\"\n                    fill=\"clear\"\n                    color=\"medium\"\n                    class=\"unblock-button\">\n          <ion-icon slot=\"start\" name=\"lock-open-outline\"></ion-icon>\n          Unblock\n        </ion-button>\n      </ion-item>\n    </ion-item-sliding>\n  </ion-list>\n</ion-content>\n";
