<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-categories"></ion-back-button>
    </ion-buttons>
    <ion-title>New Category</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Create New Category</ion-card-title>
      <ion-card-subtitle>Enter the details for the new category</ion-card-subtitle>
    </ion-card-header>
    
    <ion-card-content>
      <form [formGroup]="categoryForm">
        <ion-list lines="full" class="ion-no-margin">
          <ion-item>
            <ion-label position="stacked">Name <ion-text color="danger">*</ion-text></ion-label>
            <ion-input formControlName="name" type="text" [(ngModel)]="name" placeholder="Enter the Category Name"></ion-input>
          </ion-item>
          
          <ion-item>
            <ion-label position="stacked">Description <ion-text color="danger">*</ion-text></ion-label>
            <ion-textarea rows="4" formControlName="description" type="text" [(ngModel)]="description" placeholder="Enter a short description"></ion-textarea>
          </ion-item>
          
          <ion-item>
            <ion-label position="stacked">Image URL</ion-label>
            <ion-input formControlName="img" type="text" [(ngModel)]="img" placeholder="Enter the Image URL"></ion-input>
          </ion-item>
        </ion-list>
        
        <div class="ion-padding-top">
          <ion-button type="submit" color="primary" (click)="submit()" expand="block" [disabled]="!categoryForm.valid">
            <ion-icon name="add-circle-outline" slot="start"></ion-icon>
            Create Category
          </ion-button>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
