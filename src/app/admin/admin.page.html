<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Admin Panel</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Data Management</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Use these tools carefully. Actions performed here cannot be undone.</p>
      
      <ion-button expand="block" 
                  color="primary" 
                  (click)="confirmGenerateTestData()"
                  class="ion-margin-top">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        Generate Test Data
      </ion-button>
      
      <ion-button expand="block" 
                  color="danger" 
                  (click)="confirmDataCleanup()"
                  class="ion-margin-top">
        <ion-icon name="trash-outline" slot="start"></ion-icon>
        Clear Data-Keep Categories & Groups
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Content Management</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Manage categories and groups for the application.</p>
      
      <ion-button expand="block" 
                  color="secondary" 
                  routerLink="/admin-categories"
                  class="ion-margin-top">
        <ion-icon name="list-outline" slot="start"></ion-icon>
        Manage Categories
      </ion-button>
      
      <ion-button expand="block" 
                  color="secondary" 
                  routerLink="/admin-groups"
                  class="ion-margin-top">
        <ion-icon name="people-outline" slot="start"></ion-icon>
        Manage Groups
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
