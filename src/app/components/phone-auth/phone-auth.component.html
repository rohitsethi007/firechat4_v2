<!-- src/app/components/phone-auth/phone-auth.component.html -->
<ion-header>
  <ion-toolbar>
    <ion-title>Phone Authentication</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ng-container *ngIf="!showOtpInput">
    <!-- Phone Number Input -->
    <form [formGroup]="phoneForm" (ngSubmit)="sendOTP()">
      <ion-item>
        <ion-label position="stacked">Phone Number</ion-label>
        <ion-input 
          type="tel" 
          formControlName="phoneNumber"
          placeholder="Enter your phone number">
        </ion-input>
      </ion-item>

      <div class="error-message" *ngIf="phoneForm.get('phoneNumber').touched && phoneForm.get('phoneNumber').errors?.pattern">
        Please enter a valid phone number
      </div>

      <!-- reCAPTCHA container -->
      <div id="recaptcha-container" class="ion-margin-vertical"></div>

      <ion-button 
        expand="block" 
        type="submit" 
        [disabled]="!phoneForm.valid || loading"
        class="ion-margin-top">
        <ion-spinner *ngIf="loading"></ion-spinner>
        <span *ngIf="!loading">Send OTP</span>
      </ion-button>
    </form>
  </ng-container>

  <ng-container *ngIf="showOtpInput">
    <!-- OTP Input -->
    <form [formGroup]="otpForm" (ngSubmit)="verifyOTP()">
      <ion-item>
        <ion-label position="stacked">Enter OTP</ion-label>
        <ion-input 
          type="number" 
          formControlName="otp"
          placeholder="Enter 6-digit OTP">
        </ion-input>
      </ion-item>

      <div class="error-message" *ngIf="otpForm.get('otp').touched && otpForm.get('otp').errors?.pattern">
        Please enter a valid 6-digit OTP
      </div>

      <ion-button 
        expand="block" 
        type="submit" 
        [disabled]="!otpForm.valid || loading"
        class="ion-margin-top">
        <ion-spinner *ngIf="loading"></ion-spinner>
        <span *ngIf="!loading">Verify OTP</span>
      </ion-button>
    </form>
  </ng-container>
</ion-content>
