<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title size="large">Categories</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Categories Section
  <div class="section-header">
    <h2>Categories</h2>
  </div> -->

  <!-- Categories Horizontal Scroll -->
  <div class="categories-scroll">
    <div class="category-item" *ngFor="let category of categories" (click)="searchGroupByCategory(category)">
      <div class="category-image">
        <img [src]="category.img" [alt]="category.name">
      </div>
      <p>{{category.name}}</p>
    </div>
  </div>

  <!-- Suggested Groups Section -->
  <div class="section-header">
    <h2>Suggested Groups</h2>
  </div>

  <!-- Groups List -->
  <ion-list class="groups-list">
    <ion-item *ngFor="let group of filteredGroups" 
              button 
              detail="false" 
              class="group-item">
      <ion-avatar slot="start">
        <img [src]="group.img" [alt]="group.name">
      </ion-avatar>
      
      <ion-label>
        <h3>{{group.name}}</h3>
        <p class="group-stats">
          <span>{{group.members?.length || 0}} Members</span>
          <span class="dot-separator">•</span>
          <span>{{group.posts?.length || 0}} Posts</span>
        </p>
      </ion-label>

      <ion-button slot="end" 
                  fill="clear"
                  [color]="group.isUserMember ? 'danger' : 'primary'"
                  (click)="$event.stopPropagation(); group.isUserMember ? confirmLeaveGroup(group) : joinGroup(group.key)">
        {{group.isUserMember ? 'Leave' : 'Join'}}
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="groups?.length === 0">
    <ion-icon name="people-outline"></ion-icon>
    <h2>No Groups Found</h2>
    <p>Create a new group or join existing ones</p>
  </div>
</ion-content>
