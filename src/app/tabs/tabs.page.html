<ion-tabs class="tabs screenshot-mode">

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1">
      <ion-icon size="large" name="home"></ion-icon>
      <ion-label size="small">Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2">
      <ion-icon size="large" name="list"></ion-icon>
      <ion-label size="small">Groups</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3">
      <ion-icon size="large" name="chatbubbles"></ion-icon>
      <ion-badge *ngIf="totalUnreadMessages > 0">{{totalUnreadMessages}}</ion-badge>
      <ion-label size="small">Messages</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4">
      <ion-icon size="large" name="people"></ion-icon>
      <ion-badge *ngIf="friendRequestCount > 0">{{friendRequestCount}}</ion-badge>
      <ion-label size="small">Friends</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab5">
      <ion-icon size="large" name="ellipsis-horizontal"></ion-icon>
      <ion-label size="small">More</ion-label>
    </ion-tab-button>

    <ion-tab-button *ngIf="isAdmin" (click)="goToAdminPage()">
      <ion-icon size="large" name="settings-outline"></ion-icon>
      <ion-label size="small">Admin</ion-label>
    </ion-tab-button>
  </ion-tab-bar> 

</ion-tabs>
