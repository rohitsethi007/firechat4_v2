<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <div class="chat-header">
      <ion-avatar>
        <img [src]="userAvatar || './assets/images/default-dp.png'" alt="User avatar">
      </ion-avatar>
      <div class="user-details">
        <h2>{{title}}</h2>
        <p *ngIf="isOnline"><ion-icon name="ellipse" color="success"></ion-icon> Online</p>
      </div>
    </div>
  </ion-toolbar>
</ion-header>


<ion-content [scrollEvents]="true" #content class="chat-content">
  <div class="messages-container" #contentArea>
    <ion-button 
      *ngIf="startIndex > 0" 
      fill="clear" 
      class="load-more-btn"
      (click)="loadPreviousMessages()">
      Load previous messages
    </ion-button>

    <div class="message-wrapper" *ngFor="let message of messagesToShow">
      <div class="message-bubble" [ngClass]="{'sender': isSender(message), 'receiver': !isSender(message)}">
        <!-- Text Message -->
        <div *ngIf="message.type === 'text'" class="message-text">
          {{message.message}}
        </div>

        <!-- Image Message -->
        <div *ngIf="message.type === 'image'" class="message-image-container">
          <img [src]="message.message" 
               (click)="enlargeImage(message.message)"
               loading="lazy"
               alt="Shared image">
        </div>

        <!-- Video Message -->
        <div *ngIf="message.type === 'video'" class="message-video-container">
          <video controls playsinline>
            <source [src]="message.message" type="video/mp4">
          </video>
        </div>

        <!-- Location Message -->
        <div *ngIf="message.type === 'location'" class="message-location">
          <div [innerHTML]="message.message"></div>
        </div>

        <!-- Contact Message -->
        <div *ngIf="message.type === 'contact'" class="message-contact">
          <div [innerHTML]="message.message"></div>
        </div>

        <div class="message-timestamp">
          {{message.date | DateFormat}}
        </div>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer>
  <div class="message-input-wrapper">
    <ion-item lines="none" class="message-input-container">
      <ion-avatar slot="start">
        <img [src]="loggedInUser?.img || './assets/images/default-dp.png'" alt="user avatar">
      </ion-avatar>
      <ion-input 
        #messageInput
        placeholder="Write a message..."
        [(ngModel)]="message"
        (keyup.enter)="send('text')"
        class="message-input">
      </ion-input>
      <ion-button 
        fill="clear" 
        [disabled]="!message?.trim()"
        (click)="send('text')"
        class="send-button">
        <ion-icon name="send" [class.active]="message?.trim()"></ion-icon>
      </ion-button>
      <ion-button class="attachment-btn" fill="clear" (click)="attach()">
        <ion-icon name="attach-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </div>
</ion-footer>
